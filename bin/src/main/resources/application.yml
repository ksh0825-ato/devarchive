spring:
  datasource:
    url: jdbc:mysql://localhost:3306/devarchive?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 테이블 자동 생성 (개발 단계)
    show-sql: true     # 실행되는 SQL문 콘솔 출력
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect