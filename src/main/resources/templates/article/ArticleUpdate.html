<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>공부 기록 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
<body>
    
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <h2 class="mb-4">공부 기록 수정</h2>
    
    <form th:action="@{/article/ArticleUpdate}" th:object="${article}" method="post" class="p-4 border rounded shadow-sm bg-light">
        <input type="hidden" th:field="*{articleId}">
        
        <div class="mb-3">
            <label class="form-label fw-bold">제목</label>
            <input type="text" th:field="*{title}" class="form-control" placeholder="제목을 입력하세요">
        </div>
        
        <br>
                <div class="mb-3">
                    <label class="form-label fw-bold">공개 범위</label>

                    <div th:if="${#fields.hasErrors('visibility')}" 
                        th:errors="*{visibility}" 
                        class="text-danger small mt-1">
                    </div>

                    <div class="d-flex gap-3"> <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{visibility}" value="PUBLIC" id="pub">
                            <label class="form-check-label" for="pub">공개</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{visibility}" value="PRIVATE" id="pri">
                            <label class="form-check-label" for="pri">비공개</label>
                        </div>
                    </div>
                </div>
        <br>

        <div class="mb-3">
            <label class="form-label fw-bold">본문</label>
            <textarea th:field="*{content}" class="form-control" rows="10" placeholder="학습 내용을 기록하세요"></textarea>
        </div>

        <br>
        
        <div class="mb-4">
            <label class="form-label fw-bold">태그</label>
            <input type="text" name="tagNames" th:value="${tagNames}" class="form-control" placeholder="Java, Spring, JPA (콤마로 구분)">
            <small class="text-muted">태그는 콤마(,)를 사용하여 구분해주세요.</small>
        </div>
        
        <br>

        <div class="d-flex gap-2 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4">수정 완료</button>
            <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" class="btn btn-secondary px-4">취소</a>
        </div>
    </form>
</div>

</body>
</html>
