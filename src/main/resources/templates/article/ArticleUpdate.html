<form th:action="@{/article/ArticleUpdate}" method="post">
    <!-- articleId는 숨겨서 전달 -->
    <input type="hidden" name="articleId" th:value="${article.articleId}">
    
    <label>제목:</label>
    <input type="text" th:field="*{title}">
    
    <label>본문:</label>
    <textarea th:field="*{content}"></textarea>
    
    <!-- 태그 수정 입력창 추가 -->
    <label>태그 (콤마로 구분):</label>
    <input type="text" name="tagNames" th:value="${tagNames}" placeholder="Java, Spring">
    
    <button type="submit">수정 완료</button>
</form>
