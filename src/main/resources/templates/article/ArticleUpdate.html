<form th:action="@{/article/ArticleUpdate(articleId=${article.articleId})}" th:object="${article}" method="post">
    <!-- hidden 타입으로 ID를 넘겨주기도 하지만, 위처럼 URL 파라미터로 넘겨도 됩니다 -->
    
    <label>제목:</label>
    <input type="text" th:field="*{title}">
    
    <label>본문:</label>
    <textarea th:field="*{content}"></textarea>
    
    <button type="submit">수정 완료</button>
    <a th:href="@{/article/ArticleDetail(articleId=${article.articleId})}">취소</a>
</form>
