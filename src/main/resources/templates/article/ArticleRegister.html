<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학습 기록 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
 <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="fw-bold mb-4">학습 기록 작성</h2>
            
            <form th:action="@{/article/ArticleRegister}" th:object="${articleDto}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">제목</label>
                    <input type="text" th:field="*{title}" class="form-control" placeholder="제목을 입력하세요" required>
                </div>
                
                <div class="mb-3">
                        <select th:field="*{jobId}" class="form-select">
                            <option value="">-- 공고를 선택하세요 --</option>
                            <option th:each="job : ${jobPosts}" 
                                    th:value="${job.jobId}" 
                                    th:text="${job.companyName + ' (' + job.position + ')'}">
                            </option>
                        </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">본문</label>
                    <textarea th:field="*{content}" class="form-control" rows="10" placeholder="학습 내용을 기록하세요" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">태그 (콤마로 구분)</label>
                    <input type="text" name="tagNames" class="form-control" placeholder="예: Java,SpringBoot,JPA">
                </div>
                
                <div class="d-flex justify-content-end">
                    <a th:href="@{/article/ArticleList}" class="btn btn-outline-secondary me-2">취소</a>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
