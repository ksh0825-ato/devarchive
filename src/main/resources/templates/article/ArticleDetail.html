<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학습 기록 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="fw-bold" th:text="${article.title}">학습 기록 제목</h1>
            
            <span th:if="${studyProgress != null}" 
                class="badge" 
                th:with="statusName=${studyProgress.status.name()}"
                th:text="${studyProgress.jobPost == null ? '종료' : 
                            (statusName == 'STUDYING' ? '학습 중' : 
                            (statusName == 'COMPLETED' ? '완료' : '시작 전'))}"
                th:classappend="${studyProgress.jobPost == null ? 'bg-secondary' : 
                                (statusName == 'STUDYING' ? 'bg-warning text-dark' : 'bg-success')}">
            </span>
            <span th:if="${studyProgress == null}" class="badge bg-light text-dark">진행 상황 없음</span>
        </div>
                    
            <div class="text-muted mt-2">
                <p class="mb-1">
                    <strong>연관 채용 공고 | </strong> 
                    <span th:if="${article.jobPost != null}">
                        <a th:href="@{/job/JobPostDetail(jobId=${article.jobPost.jobId})}" 
                            class="text-decoration-none text-dark"
                           th:text="${article.jobPost.jobPostTitle} + ' (' + ${article.jobPost.companyName} + ')'"></a>
                    </span>
                    <span th:unless="${article.jobPost != null}">연관된 공고 없음</span>
                </p>
                <p><strong>작성일 | </strong>
                    <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </p>
            </div>
            
            <hr>
            
            <div class="bg-light p-3 border mb-4">
                <strong>태그:</strong>
                <a th:each="tag : ${tags}" 
                   th:href="@{/article/ArticleSearchByTag(tagName=${tag.tagName})}" 
                   th:text="'#' + ${tag.tagName}" 
                   class="text-primary text-decoration-none me-2">#Tag</a>
            </div>
            
            <div class="mt-2" style="min-height: 300px;">
                <p th:text="${article.content}" style="white-space: pre-wrap;"></p>
            </div>

            <div class="mt-4 border-top pt-3">
                <div class="d-flex justify-content-end">
                    <a th:if="${!isCompany}"
                    th:href="@{/article/ArticleUpdate(articleId=${article.articleId})}"
                    class="btn btn-outline-secondary btn-sm me-2">수정</a>
                    <a th:if="${!isCompany}" 
                    th:href="@{/article/ArticleDelete(articleId=${article.articleId})}"
                    class="btn btn-sm btn-outline-danger"
                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                </div>

                <div class="mt-3 d-flex justify-content-end">
                    <a th:href="@{/job/JobPostList}" class="text-decoration-none text-secondary">← 목록으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
