<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 학습 기록 공유 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <h2 class="fw-bold mb-4">학습 기록 공유 게시판</h2>

        <div class="card shadow-sm p-4">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>관련 공고</th>
                        <th>작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.articleId}">1</td>
                        <td>
                            <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" 
                               th:text="${article.title}" class="text-decoration-none text-muted">학습 기록 제목</a>
                        </td>
                        <td>
                            <a th:text="${article.account.nickname}" class="text-decoration-none text-muted">닉네임</a>
                        </td>
                        <td>
                            <span th:if="${article.jobPost != null}" th:text="${article.jobPost.companyName}">기업명</span>
                            <span th:unless="${article.jobPost != null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}">2026-07-01</td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${#lists.isEmpty(articles)}" class="text-center p-5 text-muted">
                공개된 학습 기록이 없습니다.
            </div>
        </div>

        <nav aria-label="Page navigation" class="mt-4" th:if="${not #lists.isEmpty(articlePage.content)}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${articlePage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/article/ArticlePublicList(page=${articlePage.number - 1})}">이전</a>
                </li>

                <li class="page-item" 
                    th:each="pageNumber : ${#numbers.sequence(
                        (articlePage.number - 2 < 0 ? 0 : articlePage.number - 2), 
                        (articlePage.number + 2 >= articlePage.totalPages ? (articlePage.totalPages == 0 ? 0 : articlePage.totalPages - 1) : articlePage.number + 2)
                    )}"
                    th:classappend="${pageNumber == articlePage.number} ? 'active'">
                    <a class="page-link" th:text="${pageNumber + 1}" th:href="@{/article/ArticlePublicList(page=${pageNumber})}">1</a>
                </li>

                <li class="page-item" th:classappend="${articlePage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/article/ArticlePublicList(page=${articlePage.number + 1})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
