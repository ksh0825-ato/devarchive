<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학습 기록 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <h2 class="fw-bold mb-4">내 학습 기록</h2>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm h-100">
            <h5 class="fw-bold mb-3">학습 통계</h5>
            <p class="mb-1">총 학습 기록: <span th:text="${totalArticles}">0</span>건</p>
            <p class="mb-0">분석 중인 공고: <span th:text="${studyingCount}">0</span>개</p>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card p-4 shadow-sm h-100">
            <h5 class="fw-bold mb-3">진행 중인 채용공고</h5>
            
            <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(progressList)}">
                <li th:each="progress : ${progressList}" class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                    <div>
                        <span class="fw-bold" th:if="${progress.jobPost != null}" th:text="${progress.jobPost.companyName}">회사명</span>
                        <span class="text-muted" th:unless="${progress.jobPost != null}">종료된 공고</span>
                    </div>
                    
                    <span class="badge" 
                          th:text="${progress.status.name() == 'STUDYING' ? '학습 중' : (progress.status.name() == 'COMPLETED' ? '완료' : '시작 전')}"
                          th:classappend="${progress.status.name() == 'STUDYING' ? 'bg-warning text-dark' : 'bg-success'}">
                    </span>
                </li>
            </ul>
            
            <p th:if="${#lists.isEmpty(progressList)}" class="text-muted mt-2">진행 중인 공고가 없습니다.</p>
        </div>
    </div>
</div>

    <div class="card shadow-sm">
        <table class="table table-hover text-center align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>관련 공고</th>
                    <th>작성일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articlePage.content}">
                    <td th:text="${article.articleId}">1</td>
                    <td class="text-start">
                        <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" 
                           th:text="${article.title}" class="text-decoration-none text-dark">제목</a>
                    </td>
                    <td>
                        <span th:if="${article.jobPost != null}" th:text="${article.jobPost.companyName}">회사명</span>
                        <span th:unless="${article.jobPost != null}" class="text-muted">-</span>
                    </td>
                    <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}">2026-07-06</td>
                    <td>
                        <a th:href="@{/article/ArticleUpdate(articleId=${article.articleId})}" class="btn btn-outline-secondary btn-sm me-2">수정</a>
                        <a th:href="@{/article/ArticleDelete(articleId=${article.articleId})}" class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-4" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">이전</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">다음</a></li>
        </ul>
    </nav>
    
    <div class="text-end mt-3">
        <a th:href="@{/article/ArticleRegister}" class="btn btn-primary">글쓰기</a>
    </div>
</div>

</body>
</html>
