<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학습 기록 리스트</title>
</head>
<body>

<!-- 상단 제목 변경 -->
<h1 th:text="${username} + '님의 학습 기록'">님의 학습 기록</h1>

<form th:action="@{/article/ArticleList}" method="post">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="글 제목 검색">
    <button type="submit">검색</button>
    <a th:href="@{/article/ArticleList}">초기화</a>
</form>

<!-- 기존 테이블 동일 사용 -->
<table border="1" th:if="${articlePage != null and articlePage.totalElements > 0}">
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>관련 공고</th>
                <th>등록일</th>
                <th>조회수</th>
                <th>상세보기</th>
            </tr>
        </thead>
        <tbody>
            <!-- articlePage.content를 반복 -->
            <tr th:each="article : ${articlePage.content}">
                <td th:text="${article.articleId}"></td>
                <td th:text="${article.title}"></td>
                <!-- 연결된 공고가 있다면 회사명 표시 -->
                <td th:text="${article.jobPost != null ? article.jobPost.companyName : '없음'}"></td>
                <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}"></td>
                <td th:text="${article.viewCount}"></td>
                <td><a th:href="@{/article/ArticleDetail(articleId=${article.articleId})}">보기</a></td>
            </tr>
        </tbody>
    </table>

    <!-- 데이터가 없을 때 메시지 변경 -->
    <p th:if="${articlePage == null or articlePage.totalElements == 0}">아직 작성하신 학습 기록이 없습니다. 첫 학습글을 작성해보세요!</p>

    <br>
    <a th:href="@{/article/ArticleRegister}">학습글 작성하기</a>
    <a th:href="@{/login/main}">메인으로 돌아가기</a>

</body>
</html>
