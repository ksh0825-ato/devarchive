<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 학습 기록 목록</title>
    <style>
        .search-area { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>학습 통계</h5>
                    <p>
                        총 학습 기록: <span th:text="${totalArticles}">0</span>건 | 
                        분석 중인 공고: <span th:text="${studyingCount}">0</span>개
                    </p>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h5>진행 중인 채용공고</h5>
                    
                    <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(progressList)}">
                        <li th:each="progress : ${progressList}" class="list-group-item d-flex justify-content-between">
                            <span th:text="${progress.jobPost.companyName}">회사명</span>
                            <span class="badge" 
                                th:text="${progress.status}"
                                th:classappend="${progress.status.name() == 'STUDYING' ? 'bg-warning' : 'bg-success'}">
                            </span>
                        </li>
                    </ul>
                    
                    <div th:unless="${not #lists.isEmpty(progressList)}" class="text-center p-3 text-muted">
                        진행 중인 공고가 없습니다.
                    </div>
                </div>
        </div>
    </div>

    <h1>내 학습 기록</h1>

    <!-- 검색창 -->
    <div class="search-area">
        <form th:action="@{/article/ArticleList}" method="post">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어 입력">
            <button type="submit">검색</button>
            <a th:href="@{/article/ArticleList}">초기화</a>
        </form>
    </div>

    <div class="container my-4">
    <div class="d-flex justify-content-end">
            <form th:action="@{/article/ArticleSearchByTag}" method="get" class="d-flex">
                <input type="text" name="tagName" class="form-control me-2" placeholder="태그 입력 (예: Spring)" required>
                <button type="submit" class="btn btn-outline-primary">검색</button>
            </form>
        </div>
    </div>

    <br>

    <!-- 목록 테이블 -->
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>관련 공고</th>
                <th>작성일</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article : ${articlePage.content}">
                <td th:text="${article.articleId}">1</td>
                <td>
                    <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" th:text="${article.title}" >
                       th:text="${article.title}">학습 기록 제목</a>
                </td>
                <td>
                    <span th:if="${article.jobPost != null}" th:text="${article.jobPost.companyName}">회사명</span>
                    <span th:unless="${article.jobPost != null}">-</span>
                </td>
                <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}">2026-07-01</td>
                <td>
                    <!-- 수정 버튼 -->
                    <a th:href="@{/article/ArticleUpdate(articleId=${article.articleId})}">수정하기</a>
                    
                    <a th:href="@{/article/ArticleDelete(articleId=${article.articleId})}" 
                    class="btn btn-danger"
                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top: 20px;">
        <a th:href="@{/article/ArticleRegister}">글쓰기</a>
    </div>

</body>
</html>
