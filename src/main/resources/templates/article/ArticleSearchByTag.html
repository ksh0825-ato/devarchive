<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>태그 검색 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
<body>
    
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="mb-4">
        <h2>태그 검색 결과</h2>
        <h4 class="text-primary" th:text="'#' + ${tagName}">#태그명</h4>
    </div>

    <div th:if="${#lists.isEmpty(articles)}" class="alert alert-info">
        해당 태그로 작성된 학습글이 없습니다.
    </div>

    <div th:if="${not #lists.isEmpty(articles)}">
        <table class="table table-hover shadow-sm rounded">
            <thead class="table-light">
                <tr>
                    <th>제목</th>
                    <th>작성일</th>
                    <th>조회수</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articles}">
                    <td>
                        <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" 
                           th:text="${article.title}">제목</a>
                    </td>
                    <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}">2026-07-02</td>
                    <td th:text="${article.viewCount}">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/article/ArticleList" class="btn btn-secondary">목록으로 돌아가기</a>
    </div>
</div>

</body>
</html>
