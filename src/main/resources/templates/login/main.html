<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevArchive - 메인 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>
                <span th:text="${account.nickname}">닉네임</span>님 환영합니다!
            </h3>
            <div class="text-muted">
                <small>ID: <span th:text="${account.username}">아이디</span></small> 
                | 
                <small th:text="${account.role == 'ROLE_COMPANY'} ? '기업 회원' : '일반 회원'">회원 유형</small>
            </div>
        </div>
    </div>

    <div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">마감 임박 채용 공고</h5>
                
                <ul class="list-group list-group-flush mt-3" th:if="${not #lists.isEmpty(urgentJobs)}">
                    <li th:each="job : ${urgentJobs}" class="list-group-item d-flex justify-content-between align-items-center">
                            <a th:href="@{/job/JobPostDetail(jobId=${job.jobId})}" class="text-decoration-none text-dark">
                                <span th:text="${job.jobPostTitle}">공고 제목</span>
                                <span class="text-muted" th:text="'| ' + ${job.companyName}">| 기업명</span>
                            </a>

                        <!-- D-DAY 카운트 -->
                        <span th:with="dday=${T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), job.deadline)}"
                            th:class="${dday <= 3} ? 'badge bg-danger rounded-pill' : 'badge bg-secondary rounded-pill'">        
                            <th:block th:text="${dday == 0} ? 'D-Day' : 'D-' + ${dday}"></th:block>
                        </span>
                        
                    </li>
                </ul>

                <div th:unless="${not #lists.isEmpty(urgentJobs)}" class="mt-4 text-center text-muted">
                    <p>현재 마감 임박 공고가 없습니다.</p>
                    <a href="/job/JobPostList" class="btn btn-sm btn-outline-primary">공고 보러가기</a>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">내 학습 기록</h5>
                
                <ul class="list-group list-group-flush mt-3" th:if="${not #lists.isEmpty(recentArticles)}">
                    <li th:each="article : ${recentArticles}" class="list-group-item border-bottom py-3">
                        <div>
                            <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" 
                            class="text-decoration-none text-dark fw-bold">
                            <span th:text="${article.title}">학습글 제목</span>
                            <span th:if="${article.jobPost != null}" th:text="'| ' + ${article.jobPost.companyName}">| 채용 공고명</span>
                            </a>
                        </div>
                        
                        <div class="small mt-1">
                            <a class="text-muted text-decoration-none" 
                            th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}">2026-07-05</a>
                            
                            <a th:each="articleTag : ${article.articleTags}" 
                            th:href="@{/article/ArticleSearchByTag(tagName=${articleTag.tag.tagName})}" 
                            class="text-primary text-decoration-underline ms-2">
                            <span th:text="'#' + ${articleTag.tag.tagName}">#태그명</span>
                            </a>
                        </div>
                    </li>
                </ul>

                <div th:unless="${not #lists.isEmpty(recentArticles)}" class="mt-4 text-center text-muted">
                    <p>아직 작성한 학습글이 없습니다.</p>
                    <a href="/article/ArticleRegister" class="btn btn-sm btn-outline-primary">첫 글 작성하기</a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex justify-content-end">
        <a href="/schedule" class="btn btn-primary me-2">! 스케줄 보기</a>
        <a href="/article/InterestJob" class="btn btn-warning">★ 관심 공고 목록</a>
    </div>
</div>

</body>
</html>
