<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevArchive - 메인 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>
                <span th:text="${account.nickname}">닉네임</span>님 환영합니다!
            </h3>
            <div class="text-muted">
                <small>ID: <span th:text="${account.username}">아이디</span></small> 
                | 
                <small th:text="${account.role == 'ROLE_COMPANY'} ? '기업 회원' : '일반 회원'">회원 유형</small>
            </div>
        </div>
    </div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title fw-bold">전체 채용 공고</h5>
                <div style="max-height: 300px; overflow-y: auto;" class="mt-3">
                    <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(jobList)}">
                        <li th:each="job : ${jobList}" class="list-group-item px-0">
                            <a th:href="@{/job/JobPostDetail(jobId=${job.jobId})}" class="text-decoration-none text-dark">
                                <span th:text="${job.companyName}">회사명</span> | 
                                <span th:text="${job.jobPostTitle}">제목</span>
                            </a>
                        </li>
                    </ul>
                    <div th:unless="${not #lists.isEmpty(jobList)}" class="text-center text-muted mt-3">등록된 공고 없음</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title fw-bold">전체 학습 기록</h5>
                <div style="max-height: 300px; overflow-y: auto;" class="mt-3">
                    <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(articleList)}">
                        <li th:each="article : ${articleList}" class="list-group-item px-0">
                            <a th:href="@{/article/ArticleDetail/{id}(id=${article.articleId})}" class="text-decoration-none text-dark fw-bold">
                                <span th:text="${article.title}">학습글 제목</span>
                            </a>
                        </li>
                    </ul>
                    <div th:unless="${not #lists.isEmpty(articleList)}" class="text-center text-muted mt-3">작성한 학습글 없음</div>
                </div>
            </div>
        </div>
    </div>
</div>

    <div class="mt-4 d-flex justify-content-end">
        <a href="/article/InterestJob" class="btn btn-warning">★ 관심 공고 목록</a>
    </div>
</div>
</body>
</html>
