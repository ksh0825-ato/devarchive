<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevArchive - 메인 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                <h5 class="card-title fw-bold">
                    <a href="/job/JobPostList" class="text-decoration-none text-dark">전체 채용 공고</a>
                </h5>
                    <div style="max-height: 300px; overflow-y: auto;" class="mt-3">
                        <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(jobList)}">
                            <li th:each="job : ${jobList}" class="list-group-item px-0 py-2">
                                <a th:href="@{/job/JobPostDetail(jobId=${job.jobId})}" class="text-decoration-none text-dark">
                                    <div>
                                        <span th:text="${job.jobPostTitle}" class="fw-bold">제목</span>
                                        <span> | </span>
                                        <span th:text="${job.companyName}" class="text-decoration-none text-dark">기업명</span>
                                    </div>
                                    
                                    <div class="small mt-1 text-muted">
                                        <span th:text="${job.position}">모집 직무</span> 
                                        <span> | </span>
                                        <span th:text="'마감일: ' + ${#temporals.format(job.deadline, 'yyyy-MM-dd')}" class="text-danger fw-bold">2026-07-30</span>
                                    </div>
                                </a>
                            </li>
                        </ul>
                        <div th:unless="${not #lists.isEmpty(jobList)}" class="text-center text-muted mt-3">등록된 공고 없음</div>
                    </div>
                </div>
            </div>
        </div>

    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title fw-bold">
                    <a href="/article/ArticlePublicList" class="text-decoration-none text-dark">학습 기록 공유 게시판</a>
                </h5>
                <p class="text-muted small">다른 개발자 지망생들은 어떻게 학습하고 있는지 확인해보세요!</p>

                <div th:replace="~{fragments/articleList :: articleList(${publicArticles}, '공개된 학습 기록이 없습니다.')}"></div></div>

                </div>
        </div>
    </div>
    
    <br>

    <div class="col-md-6" th:unless="${account != null and account.role == 'ROLE_COMPANY'}">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title fw-bold">
                    <a href="/article/ArticleList" class="text-decoration-none text-dark">전체 학습 기록</a>
                </h5>
                <div style="max-height: 300px; overflow-y: auto;" class="mt-3">

                    <div th:replace="~{fragments/articleList :: articleList(${myArticles}, '아직 작성한 학습 기록이 없습니다.')}"></div>

                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex justify-content-end">
        <a th:if="${!isCompany}"
        th:href="@{/api/interest}" class="btn btn-warning">★ 관심 공고 목록</a>
    </div>
</div>
</body>
</html>
