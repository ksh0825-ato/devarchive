<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관심 공고 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
 <div th:replace="~{fragments/header :: header}"></div>
 
<div class="container mt-5">
    <h2 class="fw-bold mb-4">나의 관심 공고 목록</h2>

    <table class="table table-hover text-center align-middle shadow-sm bg-white" 
           th:if="${interestList != null and interestList.size() > 0}">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>회사명</th>
                <th>상세보기</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="interest : ${interestList}">
                <td th:text="${interest.jobPost.jobId}"></td>
                <td>
                    <a th:href="@{/job/JobPostDetail(jobId=${interest.jobPost.jobId})}" 
                       th:text="${interest.jobPost.jobPostTitle}"
                       class="text-decoration-none text-dark">공고 제목</a>
                </td>
                <td th:text="${interest.jobPost.companyName}"></td>
                <td>
                    <a th:href="@{/job/JobPostDetail(jobId=${interest.jobPost.jobId})}" 
                       class="btn btn-outline-primary btn-sm">상세보기</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="card p-5 text-center shadow-sm" th:if="${interestList == null or interestList.size() == 0}">
        <p class="text-muted">아직 찜한 공고가 없습니다.</p>
    </div>

    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-secondary">메인으로 돌아가기</a>
    </div>
</div>

</body>
</html>
