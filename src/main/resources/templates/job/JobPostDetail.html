<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채용 공고 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
 <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="fw-bold">
                        <span class="text-warning">★</span> 
                        <span th:text="${job.jobPostTitle}">채용 공고 타이틀</span>
                    </h2>
                    <span class="text-muted" th:text="'회사명 | ' + ${job.companyName}">회사명 | (회사명)</span>
                </div>
                
                <hr class="my-2">
                
                <div class="row text-muted">
                    <div class="col">
                        <strong>모집 직종 |</strong> <span th:text="${job.position}">모집 직종명</span>
                        <span class="mx-2">|</span>
                        <strong>URL |</strong> <a th:href="${job.url}" target="_blank" th:text="${job.url}">홈페이지</a>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 p-3 bg-white border rounded">
                    <div>
                        <strong class="text-danger">마감 기간 | </strong>
                        <span class="text-danger fw-bold" th:text="'D-' + ${daysRemaining}">D-10</span>
                        <span class="text-muted" th:text="'(' + ${#temporals.format(job.deadline, 'yyyy-MM-dd')} + ')'">(~2026-00-00)</span>
                    </div>
                    <a href="#" class="btn btn-sm btn-outline-success">학습 시작</a>
                </div>
            </div>

            <div class="bg-light p-3 border rounded mb-4">
                <strong>사용 언어 :</strong> JAVA, MySQL, ... (태그 정보)
            </div>

            <div class="mt-2" style="min-height: 300px;">
                <p th:text="${job.description}" style="white-space: pre-wrap;"></p>
            </div>

            <div class="d-flex justify-content-end mt-4 border-top pt-3">
                <a th:href="@{/job/JobPostUpdate(jobId=${job.jobId})}" class="btn btn-outline-secondary btn-sm me-2">수정</a>
                <a th:href="@{/job/JobPostDelete(jobId=${job.jobId})}" class="btn btn-outline-danger btn-sm"
                   onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
            </div>
        </div>

        <div class="mt-3 text-center">
            <a th:href="@{/job/JobPostList}" class="text-decoration-none text-secondary">← 목록으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
