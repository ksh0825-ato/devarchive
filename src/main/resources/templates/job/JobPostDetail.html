<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채용 공고 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container mt-5">
        <div class="card shadow-sm p-4">

        <div class="mb-4">
                <div class="d-flex align-items-center mb-3">
                    <h2 class="fw-bold m-0 me-3">
                        <span class="text-warning">★</span> 
                        <span th:text="${job.jobPostTitle}">채용 공고 타이틀</span>
                    </h2>
                    
                    <div class="d-flex align-items-center">
                        <span class="text-muted fw-bold me-3" th:text="'회사명 | ' + ${job.companyName}">회사명 | (회사명)</span>
                        <a href="#" class="btn btn-sm btn-outline-success">학습 시작</a>
                    </div>
                </div>
                
                <hr class="my-3">
                
                <div class="mb-2">
                    <strong>모집 직종 |</strong> <span th:text="${job.position}" class="me-4">직무명</span>
                    <strong>URL |</strong> <a th:href="${job.url}" target="_blank" th:text="${job.url}">홈페이지</a>
                </div>
                
            <div class="d-flex justify-content-between align-items-center" 
                th:if="${job.deadline != null}"
                th:with="daysDiff=${T(java.time.temporal.ChronoUnit).DAYS.between(today, job.deadline)}">
                
                <div>
                    <strong class="text-secondary">마감 기간 | </strong>
                    
                    <!-- D-5 이내 또는 D-DAY인 경우 (붉은색 + 볼드체) -->
                    <span th:if="${daysDiff >= 0 and daysDiff <= 5}" class="text-danger fw-bold">
                        <span th:text="${daysDiff == 0 ? 'D-DAY' : 'D-' + daysDiff}"></span>
                    </span>
                    
                    <!-- D-6 이상인 경우 (파란색 + 볼드체) -->
                    <span th:if="${daysDiff > 5}" class="text-primary fw-bold" th:text="'D-' + ${daysDiff}"></span>
                    
                    <!-- 마감된 경우 -->
                    <span th:if="${daysDiff < 0}" class="text-muted fw-bold">마감</span>
                    
                    <span class="text-muted ms-1" th:text="'(' + ${#temporals.format(job.deadline, 'yyyy-MM-dd')} + ')'"></span>
                </div>
                
                <a href="#" class="btn btn-sm btn-outline-success">학습 시작</a>
            </div>
            
                <br>

                <div class="bg-light p-3 border rounded mb-4">
                    <strong>사용 언어 :</strong> JAVA, MySQL, ... (태그 정보)
                </div>
              </div>

                <div class="mt-2" style="min-height: 300px;">
                    <p th:text="${job.description}" style="white-space: pre-wrap;"></p>
                </div>

                <div class="d-flex justify-content-end mt-4 border-top pt-3">
                    <a th:href="@{/job/JobPostUpdate(jobId=${job.jobId})}" class="btn btn-outline-secondary btn-sm me-2">수정</a>
                    <a th:href="@{/job/JobPostDelete(jobId=${job.jobId})}" class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                </div>
            </div>

            <div class="mt-3 text-center">
                <a th:href="@{/job/JobPostList}" class="text-decoration-none text-secondary">← 목록으로 돌아가기</a>
            </div>
        </div>
    </div>
</body>
</html>
