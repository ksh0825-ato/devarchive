<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>채용 공고 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <h1 th:text="${job.jobPostTitle}"></h1>
    <p><strong>회사명:</strong> <span th:text="${job.companyName}"></span></p>
    <p><strong>직무:</strong> <span th:text="${job.position}"></span></p>
    <p><strong>등록일:</strong> <span th:text="${#temporals.format(job.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
    <p><strong>설명:</strong></p>
    <p th:text="${job.description}"></p>
    <p><strong>url:</strong> <span th:text="${job.url}"></span></p>
    <p><strong>마감일:</strong> <span th:text="${#temporals.format(job.deadline, 'yyyy-MM-dd')}"></span></p>

    
    <div style="margin-top: 20px;">
        <!-- 수정 버튼 -->
        <a th:href="@{/job/JobPostUpdate(jobId=${job.jobId})}">수정하기</a>
        
        <!-- 삭제 버튼 (확인창 추가) -->
        <form th:action="@{/job/JobPostDelete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <input type="hidden" name="jobId" th:value="${job.jobId}">
            <button type="submit" class="btn btn-danger">삭제하기</button>
        </form>
    </div>


    <a th:href="@{/job/JobPostList}">목록</a>
    <hr>

</body>

</html>
