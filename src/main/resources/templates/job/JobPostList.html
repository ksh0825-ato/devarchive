<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 채용 공고 보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <h2 class="fw-bold mb-4">전체 채용 공고 보기</h2>

    <div class="card p-3 mb-4 shadow-sm">
        <div class="mb-3">
            <input type="text" class="form-control" placeholder="조건 검색">
        </div>
        <div class="d-flex gap-3 mb-3">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="chk1"><label class="form-check-label" for="chk1">관심 기업</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="chk2"><label class="form-check-label" for="chk2">~D-7</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="chk3"><label class="form-check-label" for="chk3">~D-14</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="chk4"><label class="form-check-label" for="chk4">마감 공고 제외</label></div>
        </div>
        <div class="row g-2">
            <div class="col-md-5"><input type="text" class="form-control" placeholder="글 검색창"></div>
            <div class="col-md-5"><input type="text" class="form-control" placeholder="기업명 검색창"></div>
            <div class="col-md-2 text-end"><button class="btn btn-outline-secondary w-100">초기화</button></div>
        </div>
    </div>

    <table class="table table-hover text-center align-middle shadow-sm bg-white">
        <thead class="table-light">
            <tr>
                <th>관심</th>
                <th>번호</th>
                <th>제목</th>
                <th>기업명</th>
                <th>모집 직종</th>
                <th>마감 기한</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="jobPost : ${job.content}">
                <td>☆</td>
                <td th:text="${jobPost.jobId}"></td>

                <td>
                    <a th:href="@{/job/JobPostDetail(jobId=${jobPost.jobId})}" th:text="${jobPost.jobPostTitle}"
                        class="text-decoration-none text-dark">채용 공고 제목</a>
                </td>

                <td th:text="${jobPost.companyName}"></td>
                <td th:text="${jobPost.position}"></td>
                
                <td th:if="${jobPost.deadline != null}" 
                    th:with="daysDiff=${T(java.time.temporal.ChronoUnit).DAYS.between(today, jobPost.deadline)}">
                    
                    <!-- D-1 ~ D-5 까지 붉은색 + 볼드체 -->
                    <span th:if="${daysDiff > 0 and daysDiff <= 5}" th:text="'D-' + ${daysDiff}" class="text-danger fw-bold"></span>
                    
                    <!-- D-6 이상은 파란색 + 볼드체 -->
                    <span th:if="${daysDiff > 5}" th:text="'D-' + ${daysDiff}" class="text-primary fw-bold"></span>
                    
                    <!-- D-DAY는 붉은색 + 볼드체 -->
                    <span th:if="${daysDiff == 0}" class="text-danger fw-bold">D-DAY</span>
                    
                    <!-- 마감일 경우 회색 -->
                    <span th:if="${daysDiff < 0}" class="text-muted fw-bold">마감</span>
                </td>
                                
                <td>
                    <a th:href="@{/job/JobPostUpdate(jobId=${jobPost.jobId})}" 
                    class="btn btn-outline-secondary btn-sm me-2">수정</a>
                    <a th:href="@{/job/JobPostDelete(jobId=${jobPost.jobId})}" 
                    class="btn btn-outline-danger btn-sm"
                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                </td>
            </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation" class="mt-4" th:if="${job.totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${job.first} ? 'disabled'">
                <a class="page-link" th:href="@{/job/JobPostList(page=${job.number - 1})}">이전</a>
            </li>

            <li class="page-item" 
                th:each="pageNumber : ${#numbers.sequence(
                    (job.number - 2 < 0 ? 0 : job.number - 2), 
                    (job.number + 2 >= job.totalPages ? (job.totalPages == 0 ? 0 : job.totalPages - 1) : job.number + 2)
                )}"
                th:classappend="${pageNumber == job.number} ? 'active'">
                <a class="page-link" th:text="${pageNumber + 1}" th:href="@{/job/JobPostList(page=${pageNumber})}">1</a>
            </li>

            <li class="page-item" th:classappend="${job.last} ? 'disabled'">
                <a class="page-link" th:href="@{/job/JobPostList(page=${job.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>

    <div class="text-end">
        <a th:href="@{/job/JobPostRegister}" class="btn btn-success">글쓰기</a>
    </div>
</div>

</body>
</html>
