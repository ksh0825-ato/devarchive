<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채용 공고 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="fw-bold mb-4">채용 공고 작성</h2>
            
            <form th:action="@{/job/JobPostRegister}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">제목</label>
                    <input type="text" name="jobPostTitle" class="form-control" placeholder="공고 제목을 입력하세요" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">회사명</label>
                        <input type="text" name="companyName" class="form-control" placeholder="회사명을 입력하세요" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">직무</label>
                        <input type="text" name="position" class="form-control" placeholder="모집 직무를 입력하세요" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">URL</label>
                    <input type="text" name="url" class="form-control" placeholder="채용 공고 URL을 입력하세요">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">마감일</label>
                    <input type="date" name="deadline" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">설명</label>
                    <textarea name="description" class="form-control" rows="8" placeholder="상세 내용을 입력하세요"></textarea>
                </div>
            
                <div class="d-flex justify-content-end">
                    <a th:href="@{/job/JobPostList}" class="btn btn-outline-secondary me-2">취소</a>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
