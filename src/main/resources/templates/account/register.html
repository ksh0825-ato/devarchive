<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - DevArchive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-card { max-width: 500px; margin: 50px auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="card register-card shadow-sm p-4">
        <div class="card-body">
            <h2 class="card-title fw-bold text-center mb-4">회원가입</h2>
            
            <form th:action="@{/account/register}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">아이디</label>
                    <input type="text" name="username" class="form-control" placeholder="아이디를 입력하세요" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">비밀번호</label>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">이메일</label>
                    <input type="email" name="email" class="form-control" placeholder="이메일을 입력하세요" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">닉네임</label>
                    <input type="text" name="nickname" class="form-control" placeholder="닉네임을 입력하세요" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">회원 유형</label>
                    <select name="role" class="form-select">
                        <option value="ROLE_USER">일반 유저</option>
                        <option value="ROLE_COMPANY">기업</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">가입하기</button>
                </div>
            </form>
            
            <div class="mt-3 text-center">
                <span class="text-muted">이미 계정이 있으신가요?</span>
                <a href="/account/login" class="text-decoration-none">로그인</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
