<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - DevArchive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="card login-card shadow-sm p-4">
        <div class="card-body">
            <h2 class="card-title fw-bold text-center mb-4">로그인</h2>
            
            <form th:action="@{/account/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">아이디</label>
                    <input type="text" name="username" class="form-control" placeholder="아이디를 입력하세요" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">비밀번호</label>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">로그인</button>
                </div>
            </form>
            
            <div class="mt-3 text-center">
                <a href="/account/register" class="text-decoration-none">회원가입</a>
            </div>
        </div>
    </div>
</div>


</body>
</html>
